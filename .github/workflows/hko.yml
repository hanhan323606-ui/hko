name: hko-push
on:
  schedule:
    - cron: "6,16,26,36,46,56 * * * *"
  workflow_dispatch:
concurrency:
  group: hko
  cancel-in-progress: false
jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .hko_tg_state
          key: hko-state-${{ github.run_id }}
          restore-keys: hko-state-
      - name: poll + push
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          MODE: cont
          MAX_RUN: "150"
        run: python3 -u hko_tg_sched.py

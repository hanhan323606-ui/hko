name: hko-push
on:
  schedule:
    - cron: "*/30 * * * *"      # 兜底：链路断了靠它复活
  workflow_dispatch:
permissions:
  actions: write
  contents: read
concurrency:
  group: hko
  cancel-in-progress: false
jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: queue next run (无缝接力)
        if: always()
        env:
          GH: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST -H "Authorization: Bearer $GH" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/hko.yml/dispatches" \
            -d '{"ref":"main"}' -o /dev/null -w "queued_next=%{http_code}\n"
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .hko_tg_state
          key: hko-state-${{ github.run_id }}
          restore-keys: hko-state-
      - name: poll + push
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          MODE: cont
          MAX_RUN: "250"
        run: python3 -u hko_tg_sched.py

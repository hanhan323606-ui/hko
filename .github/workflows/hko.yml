name: hko-push
on:
  schedule:
    - cron: "*/30 * * * *"      # 只作兜底：链路断了才靠它复活（GitHub 定时经常延迟十几分钟）
  workflow_dispatch:
permissions:
  actions: write                # 允许自己触发下一次运行，形成连续链路
  contents: read
concurrency:
  group: hko
  cancel-in-progress: false
jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .hko_tg_state
          key: hko-state-${{ github.run_id }}
          restore-keys: hko-state-
      - name: poll + push
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          MODE: cont
          MAX_RUN: "250"
        run: python3 -u hko_tg_sched.py
      - name: chain next run
        if: always()
        env:
          GH: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 5
          curl -s -X POST \
            -H "Authorization: Bearer $GH" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/hko.yml/dispatches" \
            -d '{"ref":"main"}' -o /dev/null -w "chain=%{http_code}\n"
